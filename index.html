<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Turbo Road - Car Racing Game</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-container">

    <!-- HEADER -->
    <header class="top-bar">
      <div class="game-title">
        <h1>🏎️ TURBO ROAD</h1>
        <span>NEON HIGHWAY</span>
      </div>

      <button id="pauseBtn" class="pause-btn">Ⅱ</button>
    </header>


    <!-- GAME INFORMATION -->
    <div class="hud">

      <div class="hud-box">
        <span>🏆</span>
        <strong id="score">0</strong>
        <small>SCORE</small>
      </div>

      <div class="hud-box">
        <span>🪙</span>
        <strong id="coins">0</strong>
        <small>COINS</small>
      </div>

      <div class="hud-box">
        <span>❤️</span>
        <strong id="lives">3</strong>
        <small>LIVES</small>
      </div>

      <div class="hud-box">
        <span>⚡</span>
        <strong id="speed">1</strong>
        <small>SPEED</small>
      </div>

    </div>


    <!-- GAME AREA -->
    <main id="game">

      <!-- SKY -->
      <div class="sky">

        <div class="moon"></div>

        <div class="star star1"></div>
        <div class="star star2"></div>
        <div class="star star3"></div>
        <div class="star star4"></div>
        <div class="star star5"></div>

      </div>


      <!-- ROAD -->
      <div class="road">

        <div class="road-line line1"></div>
        <div class="road-line line2"></div>

      </div>


      <!-- PLAYER CAR -->
      <div id="player" class="player-car">
        🏎️
      </div>


      <!-- ENEMY CARS AND COINS WILL APPEAR HERE -->
      <div id="objects"></div>


      <!-- START SCREEN -->
      <div id="startScreen" class="screen">

        <div class="menu-card">

          <div class="big-logo">
            🏎️
          </div>

          <h2>TURBO ROAD</h2>

          <p>
            Dodge traffic<br>
            Collect coins<br>
            Become the fastest driver!
          </p>

          <button id="startBtn" class="play-btn">
            ▶ PLAY GAME
          </button>

        </div>

      </div>


      <!-- PAUSE SCREEN -->
      <div id="pauseScreen" class="screen hidden">

        <div class="menu-card">

          <div class="big-logo">
            ⏸️
          </div>

          <h2>GAME PAUSED</h2>

          <button id="resumeBtn" class="play-btn">
            ▶ RESUME
          </button>

        </div>

      </div>


      <!-- GAME OVER SCREEN -->
      <div id="gameOverScreen" class="screen hidden">

        <div class="menu-card">

          <div class="big-logo">
            💥
          </div>

          <h2>GAME OVER</h2>

          <p>
            Your Score:
            <strong id="finalScore">0</strong>
          </p>

          <p>
            Coins:
            <strong id="finalCoins">0</strong>
          </p>

          <button id="restartBtn" class="play-btn">
            🔄 PLAY AGAIN
          </button>

        </div>

      </div>

    </main>


    <!-- MOBILE CONTROLS -->
    <div class="controls">

      <button id="leftBtn" class="control-btn">
        ◀
      </button>

      <button id="boostBtn" class="boost-btn">
        ⚡
        <span>BOOST</span>
      </button>

      <button id="rightBtn" class="control-btn">
        ▶
      </button>

    </div>


    <!-- HELP -->
    <div class="instructions">
      ◀ ▶ Steer &nbsp; • &nbsp;
      ⚡ Boost &nbsp; • &nbsp;
      Avoid traffic!
    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="game.js"></script>

</body>
</html>
