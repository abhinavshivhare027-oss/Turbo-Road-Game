<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turbo Road</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

  <header>
    <h1>🏎️ TURBO ROAD</h1>
    <p>NEON HIGHWAY</p>
  </header>

  <div class="hud">
    <span>🏆 <b id="score">0</b></span>
    <span>🪙 <b id="coins">0</b></span>
    <span>❤️ <b id="lives">3</b></span>
    <span>⚡ <b id="speed">1</b></span>
  </div>

  <div id="gameArea">

    <div class="sky"></div>

    <div class="road">
      <div class="roadLine l1"></div>
      <div class="roadLine l2"></div>
    </div>

    <div id="traffic"></div>

    <div id="player">
      <div class="carBody">
        <div class="window"></div>
        <div class="light left"></div>
        <div class="light right"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
      </div>
    </div>

    <div id="startScreen" class="screen">
      <h2>🏁 TURBO ROAD</h2>
      <p>Race • Dodge • Collect</p>
      <button id="startBtn">START GAME</button>
    </div>

    <div id="gameOver" class="screen hidden">
      <h2>💥 GAME OVER</h2>
      <p>Score: <b id="finalScore">0</b></p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>

  </div>

  <div class="controls">
    <button id="leftBtn">⬅️</button>
    <button id="boostBtn">⚡</button>
    <button id="rightBtn">➡️</button>
  </div>

</div>

<script src="game.js"></script>

</body>
</html>
